[project]
name = "lark-rag"
version = "0.1.0"
description = "飞书/Lark 知识库 RAG：文档入库 + 机器人问答一体化（进程内直调召回，无 HTTP）"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "lark-oapi>=1.6.5,<2",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "cryptography>=44.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "boto3>=1.36.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "pypdf2>=3.0.1",
    "markitdown>=0.1.1",
    "pymupdf>=1.25.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.2",
    "loguru>=0.7.3",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
    "datasketch",
    "jieba",
    "tqdm",
    "qdrant-client",
    "fastembed>=0.6.0",
    "markdown-it-py>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
